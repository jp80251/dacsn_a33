
services:

  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    container_name: forgejo
    restart: unless-stopped

    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: bd:5432
      FORGEJO__database__NAME: ${POSTGRES_DB}
      FORGEJO__database__USER: ${POSTGRES_USER}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}

      FORGEJO__server__DOMAIN: ${DIRECCION}
      FORGEJO__server__ROOT_URL: http://${DIRECCION}:${PUERTO}/
      FORGEJO__server__SSH_PORT: ${PUERTO_SSH}
      FORGEJO__server__SSH_LISTEN_PORT: 22

      FORGEJO__security__INSTALL_LOCK: "true"

      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: correo
      FORGEJO__mailer__SMTP_PORT: 1025
      FORGEJO__mailer__FROM: forgejo@localhost

      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://:${REDIS_CONTRASENA}@cache:6379/0

      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://:${REDIS_CONTRASENA}@cache:6379/0

      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://:${REDIS_CONTRASENA}@cache:6379/0
      
      USER_UID: 1000
      USER_GID: 1000

    ports:
      - "${PUERTO}:3000"
      - "${PUERTO_SSH}:22"

    volumes:
      - forgejo-datos:/data

    networks:
      - interna

    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started

  bd:
    image: postgres:18
    container_name: bd
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - bd-datos:/var/lib/postgresql

    networks:
      - interna

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7.2
    container_name: cache
    restart: unless-stopped

    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]

    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}

    volumes:
      - cache-datos:/data

    networks:
      - interna

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  correo:
    image: axllent/mailpit:latest
    container_name: correo
    restart: unless-stopped

    ports:
      - "${PUERTO_CORREO}:8025"

    networks:
      - interna

volumes:
  forgejo-datos:
  bd-datos:
  cache-datos:

networks:
  interna:
    name: interna
    driver: bridge
