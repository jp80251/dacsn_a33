
server {
    listen 80;

    
    root /var/www/html;
    index index.php;

    
    location / {
        try_files $uri $uri/ /yourls-loader.php$is_args$args;
    }


    location ~ \.php$ {
        fastcgi_pass acortador:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
