
services:
  tienda:
    image: prestashop/prestashop:8.2
    environment:
      DB_SERVER: bd
      DB_NAME: ${NOMBRE_BD}
      DB_USER: ${USUARIO_BD}
      DB_PASSWD: ${CONTRASENA_BD}
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: ${DIRECCION}:${PUERTO:-8080}
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_DEMO_MODE: 0
      PS_FOLDER_ADMIN: admin-tienda
      PS_FOLDER_INSTALL: install-tienda
      ADMIN_MAIL: ${CORREO_ADMIN}
      ADMIN_PASSWD: ${CONTRASENA_ADMIN}
    volumes:
      - ficherosTienda:/var/www/html
    networks:
      - interna
    ports:
      - "${PUERTO:-8080}:80"
    depends_on:
      bd:
        condition: service_healthy
      correo:
        condition: service_started
    restart: unless-stopped

  bd:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${NOMBRE_BD}
      MARIADB_USER: ${USUARIO_BD}
      MARIADB_PASSWORD: ${CONTRASENA_BD}
      MARIADB_ROOT_PASSWORD: ${CONTRASENA_ROOT}
    volumes:
      - datosBD:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  correo:
    image: axllent/mailpit:v1.32
    networks:
      - interna
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles:
      - herramientas
    networks:
      - interna
    ports:
      - "${PUERTO_ADMINER:-8081}:8080"
    depends_on:
     bd:
        
    restart: unless-stopped

volumes:
  ficherosTienda:
  datosBD:

networks:
  interna:
    name: interna
    driver: bridge
